name: trusted-publishing-preparation
# Deliberately manual. No PyPI tokens are accepted or stored. Configure the
# matching PyPI trusted publisher and protected environment before dispatch.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Publication target
        type: choice
        options: [testpypi, pypi]
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish to TestPyPI using OIDC
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI using OIDC
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
